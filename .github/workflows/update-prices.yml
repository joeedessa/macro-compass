name: Update prices

# Prices get their own workflow, on a much shorter cycle than the hourly data
# job, because they are the one thing every page needs and the only thing that
# goes visibly stale.
#
# The reason this exists at all: a static page cannot call Yahoo directly (no
# access-control-allow-origin), so live prices went through free public CORS
# proxies, and in August 2026 all of them failed at once and stayed down. The
# fallback snapshot was hourly, so pages showed prices up to an hour old.
#
# Fifteen minutes closes almost the whole gap, because Yahoo's own feed is
# fifteen-minute delayed regardless: a quarter-hourly snapshot is close to what
# the proxied "live" path ever delivered, and it depends on nothing outside
# GitHub. Scheduled runs are best-effort and can slip under load, so treat this
# as "about every fifteen minutes", not a guarantee.
#
# This job writes ONLY prices-latest.json — the last close per symbol, about
# thirteen kilobytes. The year of daily bars and the weekly and monthly series
# live in prices.json and are refreshed hourly by update-data.yml, because
# committing three megabytes every fifteen minutes would add roughly 600KB of
# compressed git objects each time: 59MB a day, 1.7GB a month, on a repository
# currently under a hundred. Almost none of that history changes between runs;
# only the tip does, so only the tip is written this often.

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

# A slow run must never stack on top of the next one; the newer prices win.
concurrency:
  group: update-prices
  cancel-in-progress: true

jobs:
  prices:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch latest prices
        run: python3 scripts/fetch_prices.py --latest

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/prices-latest.json
          if git diff --cached --quiet; then
            echo "No price changes."
          else
            git commit -m "Update prices $(date -u +'%F %H:%M')"
            # The hourly data job commits to the same branch, so a push can
            # lose a race with it. Rebase and retry rather than failing: the
            # two jobs touch different files and never truly conflict.
            for i in 1 2 3; do
              git push && exit 0
              echo "push rejected, rebasing (attempt $i)"
              git pull --rebase --autostash origin main || true
            done
            echo "could not push after 3 attempts" >&2
            exit 1
          fi
