name: Update data

on:
  schedule:
    # Hourly. Sources publish end-of-day, so most runs find nothing changed and
    # commit nothing; the point is to pick up a new close within the hour it
    # lands rather than waiting for the next morning.
    - cron: "20 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch latest data
        run: python3 scripts/fetch_data.py

      - name: Fetch 13F holdings
        run: python3 scripts/fetch_letters.py || true   # quarterly data; a bad EDGAR day must not block the price refresh

      - name: Fetch watchlist earnings and dividend events
        run: python3 scripts/fetch_events.py || true    # Yahoo can rate-limit; keep last good file rather than fail the run

      - name: Enrich portfolio positions
        run: python3 scripts/fetch_portfolio.py || true  # 405 names in one scanner call; keep last good file on a bad run

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A docs/data/   # -A: watch-events.json may not exist on a rate-limited first run
          if git diff --cached --quiet; then
            echo "No data changes."
          else
            git commit -m "Update data $(date -u +%F)"
            git push
          fi
