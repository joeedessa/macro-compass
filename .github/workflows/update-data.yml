name: Update data

on:
  schedule:
    # Hourly. Sources publish end-of-day, so most runs find nothing changed and
    # commit nothing; the point is to pick up a new close within the hour it
    # lands rather than waiting for the next morning.
    - cron: "20 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Three of these read TradingView's scanner, which can answer with every
      # symbol present and every fundamental null. That is not an error and
      # nothing raises, so each script measures its own coverage against the
      # file already committed and exits 1 rather than publish a blank one —
      # which is what the `|| true` below has always claimed to protect.
      - name: Fetch latest data
        run: python3 scripts/fetch_data.py

      # The long series behind the price floor — three megabytes, and it gains
      # exactly one bar a day. Refreshing it hourly would commit 15MB of git
      # objects a day to add nothing; once after the US close is enough, and
      # the quarter-hourly job keeps the current price fresh by splicing its
      # tip onto whatever history is on disk. A history a few hours old is not
      # stale, it is simply missing today's bar, which the tip supplies.
      # Once a day, decided by how old the file is rather than by the clock.
      #
      # This used to run only when the UTC hour was 23, which assumed a run
      # would happen every hour. It does not: this workflow fires four or five
      # times a day at whatever hours the scheduler feels like, and across the
      # last forty runs exactly two landed inside hour 23. The one before those
      # wrote the history on 31 August and nothing hit the window again for
      # four and a half days, so the file the fallback path reads was stale by
      # most of a week while every other feed beside it refreshed hourly.
      #
      # The age is read from generated_at inside the file, not from its mtime,
      # because checkout stamps every file with the moment it was checked out.
      - name: Fetch price history (once a day)
        run: |
          need=$(python3 - <<'EOF'
          import json, datetime
          try:
              g = json.load(open("docs/data/prices.json"))["generated_at"]
              t = datetime.datetime.strptime(g[:19], "%Y-%m-%dT%H:%M:%S").replace(
                  tzinfo=datetime.timezone.utc)
              age = (datetime.datetime.now(datetime.timezone.utc) - t).total_seconds()
              print("1" if age >= 20 * 3600 else "0")
              import sys; print(f"history is {age/3600:.1f}h old", file=sys.stderr)
          except Exception as e:
              print("1")
              import sys; print(f"no readable history ({e}); fetching", file=sys.stderr)
          EOF
          )
          if [ "$need" = "1" ]; then
            python3 scripts/fetch_prices.py || true
          else
            echo "history is current; skipping"
          fi

      - name: Fetch 13F holdings
        run: python3 scripts/fetch_letters.py || true   # quarterly data; a bad EDGAR day must not block the price refresh

      - name: Fetch watchlist earnings and dividend events
        run: python3 scripts/fetch_events.py || true    # exits 1 rather than publish a thin scanner response; || true keeps the last good file

      - name: Enrich portfolio positions
        run: python3 scripts/fetch_portfolio.py || true  # same guard: a run that loses its fundamentals refuses to overwrite

      - name: Fetch AI credit, capex and concentration
        run: python3 scripts/fetch_ai.py || true         # FINRA and FRED rate-limit, and the scanner thins out; both keep the last good file

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A docs/data/   # -A: watch-events.json may not exist on a rate-limited first run
          if git diff --cached --quiet; then
            echo "No data changes."
          else
            git commit -m "Update data $(date -u +%F)"
            # The price loop commits to this branch every five minutes, so a
            # push started any time after checkout is very likely to be behind
            # by the time it lands — which is exactly what happened: every run
            # of this job on 29 August failed here, at 11:05, 15:37, 19:24 and
            # 22:39, having done all its real work successfully. The two jobs
            # touch different files and never truly conflict, so rebase onto
            # whatever arrived and try again rather than treating a lost race
            # as a failed run.
            for i in 1 2 3 4 5; do
              if git push; then exit 0; fi
              echo "push rejected, rebasing (attempt $i)"
              git pull --rebase --autostash origin main || true
            done
            echo "::error::could not push after 5 attempts"
            exit 1
          fi
