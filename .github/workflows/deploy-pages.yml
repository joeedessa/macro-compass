name: Deploy Pages

on:
  push:
    branches: [main]
  # A push made with the default GITHUB_TOKEN does not trigger other workflows —
  # GitHub blocks that to stop loops. The hourly data job commits with exactly
  # that token, so its commits landed on main and never deployed: the site sat
  # on whatever the last human push produced. This fires the deploy when the
  # data job finishes instead.
  workflow_run:
    # "Update prices" is here for one reason: its commits are made with the
    # default token too, so the five-minute snapshot was landing on main and
    # never being published. The site sat on whatever the last data job had
    # deployed — three hours old when this was found. It was not visible,
    # because live prices come from the Cloudflare worker and the snapshot is
    # only the floor beneath it, but a floor nobody refreshes is not much of one.
    workflows: ["Update data", "Update prices"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main          # workflow_run does not carry a ref; take current main
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
